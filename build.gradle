buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:3.0.197' }
}
apply plugin: 'net.minecraftforge.gradle'
version = '0.0.4'
group = 'dev.dronesmc'
archivesBaseName = 'dronesmc'
sourceCompatibility = targetCompatibility = '1.8'
if (System.getenv('DRONESMC_BUILD_DIR')) buildDir = file(System.getenv('DRONESMC_BUILD_DIR'))
minecraft {
    mappings channel: 'stable', version: '39-1.12'
    runs {
        client { workingDirectory project.file('run') }
        server { workingDirectory project.file('run-server') }
    }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2859'
    testImplementation 'junit:junit:4.13.2'
}
jar {
    manifest { attributes 'Implementation-Title': 'DronesMC', 'Implementation-Version': project.version }
}
jar.finalizedBy('reobfJar')
